<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <title>Chad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            color: black;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        .nav-menu {
            display: flex;
            gap: 40px;
        }

        .nav-item {
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.3s;
            text-transform: lowercase;
            font-family: 'Onest', sans-serif;
            font-weight: 500;
        }

        .nav-item:hover {
            opacity: 0.7;
        }

        .nav-item.active {
            border-bottom: 1px solid black;
            padding-bottom: 2px;
        }

        .info-btn {
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }

        .info-btn:hover {
            opacity: 0.7;
        }

        .main-content {
            margin-top: 80px;
            padding: 0;
        }

        .gallery {
            display: none;
            padding: 40px;
        }

        .gallery.active {
            display: block;
        }

        .photo-grid {
            columns: 3;
            column-gap: 20px;
        }

        .photo-item {
            break-inside: avoid;
            margin-bottom: 20px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .photo-item:hover {
            opacity: 0.8;
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: black;
            font-size: 30px;
            cursor: pointer;
            z-index: 2001;
            transition: opacity 0.3s;
        }

        .modal-close:hover {
            opacity: 0.7;
        }

        .info-panel {
            display: none;
            position: fixed;
            top: 80px;
            right: 40px;
            blacknd: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid #333;
            z-index: 1500;
            max-width: 300px;
        }

        .info-panel.active {
            display: block;
        }

        .numbering {
            position: fixed;
            bottom: 40px;
            left: 40px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .nav {
                padding: 15px 20px;
            }

            .nav-menu {
                gap: 20px;
            }

            .nav-item, .info-btn {
                font-size: 12px;
            }

            .main-content {
                margin-top: 60px;
            }

            .gallery {
                padding: 20px;
            }

            .photo-grid {
                columns: 2;
                column-gap: 15px;
            }

            .photo-item {
                margin-bottom: 15px;
            }

            .numbering {
                bottom: 20px;
                left: 20px;
            }

            .modal-close {
                right: 20px;
                top: 20px;
            }

            .info-panel {
                right: 20px;
                max-width: 250px;
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                columns: 1;
            }

            .nav-menu {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-close">&times;</div>
        <div class="modal-content">

    <!-- Info Panel -->
    <div id="infoPanel" class="info-panel">
        <p>Photographer based in Montreal</p>

    </div>

    <!-- Numbering -->
    <div class="numbering">
        <span id="currentNumber">1</span>
        <span id="totalNumber"></span>
    </div>

    <script>
        let currentGallery = 'snaps';
        let currentImageIndex = 0;
        let totalImages = 0;

        function showGallery(gallery) {
            // Hide all galleries
            document.querySelectorAll('.gallery').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Show selected gallery
            document.getElementById(gallery).classList.add('active');
            event.target.classList.add('active');
            
            currentGallery = gallery;
            updateNumbering();
        }

        function openModal(imageSrc) {
            document.getElementById('modalImg').src = imageSrc;
            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function toggleInfo() {
            const panel = document.getElementById('infoPanel');
            panel.classList.toggle('active');
        }

        function updateNumbering() {
            const activeGallery = document.querySelector('.gallery.active');
            const images = activeGallery.querySelectorAll('.photo-item');
            totalImages = images.length;
            document.getElementById('totalNumber').textContent = '/' + totalImages;
            
            // Update current number on scroll or image hover
            let observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const index = Array.from(images).indexOf(entry.target) + 1;
                        document.getElementById('currentNumber').textContent = index;
                    }
                });
            }, { threshold: 0.5 });
            
            images.forEach(img => observer.observe(img));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateNumbering();
        });

        // Close modal with escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                const panel = document.getElementById('infoPanel');
                panel.classList.remove('active');
            }
        });

        // Close info panel when clicking outside
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('infoPanel');
            const infoBtn = document.querySelector('.info-btn');
            if (!panel.contains(e.target) && !infoBtn.contains(e.target)) {
                panel.classList.remove('active');
            }
        });
    </script>
