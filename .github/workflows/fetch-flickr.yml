name: Fetch Flickr Photos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flickrapi
        run: pip install flickrapi

      - name: Fetch photos from Flickr
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_SECRET: ${{ secrets.FLICKR_SECRET }}
        run: |
          python3 << 'EOF'
          import flickrapi, json, os

          api_key = os.environ['FLICKR_API_KEY']
          secret = os.environ.get('FLICKR_SECRET', '')
          user_id = '131401388@N03'

          flickr = flickrapi.FlickrAPI(api_key, secret, format='parsed-json')

          photosets = flickr.photosets.getList(user_id=user_id, per_page=500)
          print(f'Found {len(photosets["photosets"]["photoset"])} albums')

          galleries = {}
          for ps in photosets['photosets']['photoset']:
              title = ps['title']['_content'].strip().lower()
              ps_id = ps['id']

              res = flickr.photosets.getPhotos(
                  photoset_id=ps_id, user_id=user_id,
                  extras='url_b,url_m', per_page=500, media='photos'
              )
              photos = []
              for p in res['photoset']['photo']:
                  photos.append({
                      'id': p['id'],
                      'url': p.get('url_b') or p.get('url_m', ''),
                      'flickr': f'https://www.flickr.com/photos/131401388@N03/{p["id"]}'
                  })
              galleries[title] = photos
              print(f'  {title}: {len(photos)} photos')

          with open('photos.json', 'w') as f:
              json.dump(galleries, f)
          print('Done')
          EOF

      - name: Commit photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos.json
          git diff --staged --quiet || (git commit -m "Update Flickr photos" && git pull --rebase && git push)
