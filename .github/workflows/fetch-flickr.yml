name: Fetch Flickr Photos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch photos from Flickr
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os

          api_key = os.environ['FLICKR_API_KEY']
          base = 'https://www.flickr.com/services/rest'

          def call(method, **params):
              p = '&'.join(f'{k}={v}' for k, v in params.items())
              url = f'{base}?method={method}&api_key={api_key}&format=json&nojsoncallback=1&{p}'
              with urllib.request.urlopen(url) as r:
                  return json.loads(r.read())

          # resolve NSID — try lookupUser, fall back to numeric ID directly
          res = call('flickr.urls.lookupUser', url='https://www.flickr.com/people/131401388')
          if res.get('stat') == 'ok':
              user_id = res['user']['id']
          else:
              res = call('flickr.people.getInfo', user_id='131401388')
              user_id = res['person']['id']
          print(f'Resolved user_id: {user_id}')

          # get all photosets
          res = call('flickr.photosets.getList', user_id=user_id, per_page=500)
          photosets = res['photosets']['photoset']

          galleries = {}
          for ps in photosets:
              title = ps['title']['_content'].strip().lower()
              ps_id = ps['id']

              # fetch photos in this photoset
              res2 = call('flickr.photosets.getPhotos',
                          photoset_id=ps_id, user_id=user_id,
                          extras='url_b,url_m', per_page=500, media='photos')
              photos = []
              for p in res2['photoset']['photo']:
                  photos.append({
                      'id': p['id'],
                      'url': p.get('url_b') or p.get('url_m', ''),
                      'flickr': f'https://www.flickr.com/photos/131401388/{p["id"]}'
                  })

              galleries[title] = photos

          with open('photos.json', 'w') as f:
              json.dump(galleries, f)

          print(f'Generated photos.json with galleries: {list(galleries.keys())}')
          EOF

      - name: Commit photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos.json
          git diff --staged --quiet || (git commit -m "Update Flickr photos" && git push)
